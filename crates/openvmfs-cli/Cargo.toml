[package]
name = "openvmfs-cli"
description = "Command line tool for reading VMFS6 volumes and the virtual disks stored on them"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "openvmfs"
path = "src/main.rs"

[dependencies]
openvmfs = { path = "../openvmfs" }
sha2 = "0.10"

# The workspace lints, except that unsafe code is denied instead of forbidden: src/rawdev.rs allows it for the one
# call that asks Windows for the size of a raw disk.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
arithmetic_side_effects = "warn"
cast_possible_truncation = "warn"
indexing_slicing = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
undocumented_unsafe_blocks = "deny"
